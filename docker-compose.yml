services:

    ecommerce-db:
        image: postgres:18.2
        restart: always
        environment:
            POSTGRES_DB: ecommerce-db
            POSTGRES_USER: develop
            POSTGRES_PASSWORD: develop
        volumes:
            - ./database/ecommerce-db:/var/lib/postgresql
        ports:
            - "5432:5432"
        networks:
            - microservices-net
        logging:
            driver: json-file
            options:
                max-size: "5m"

networks:
    microservices-net:
        driver: bridge
